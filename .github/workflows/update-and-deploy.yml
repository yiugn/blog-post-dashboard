name: Update posts and deploy dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: blog-dashboard-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install collector dependencies
        run: pip install -r requirements.txt

      - name: Collect all new posts
        env:
          WIKIDOCS_BLOGS_JSON: ${{ secrets.WIKIDOCS_BLOGS_JSON }}
        run: python scripts/update_posts.py

      - name: Commit refreshed table
        run: |
          if git diff --quiet -- data/posts.json data/posts.csv; then
            echo "No table changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/posts.json data/posts.csv
            git commit -m "data: refresh blog post table"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
